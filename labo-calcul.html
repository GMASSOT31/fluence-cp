<!-- Même habillage que le Zoo de Lecture (copie générée par tools/extract_zoo_skin.py) ; les couleurs du calcul sont dans le bloc <style> ci-dessous -->
<link rel="stylesheet" href="calcul/zoo-skin.css?v=1">
<style>
  /* ===== Identité « calcul » : vert émeraude / turquoise (la lecture est bleu-violet). Le mot « Calcul » et le signe ➕ portent aussi la différence. ===== */
  [hidden] { display: none !important; }
  body.calc { --calc: #0b7f7d; --calc-d: #075f5d; --calc-l: #d6f3ee; }
  #zoo-frame { display: block; width: 100%; height: 560px; border: 0; border-radius: 16px; background: transparent; }
  body.zoo-view.mode-student main, body.zoo-view main { padding-bottom: 8px !important; }
  body.zoo-playing { overflow: hidden; }
  body.zoo-playing #zoo-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh !important; z-index: 90; background: var(--bg); }
  .test-band { position: sticky; top: 0; z-index: 60; background: #ffe9b8; color: #7a4b00; text-align: center; font-weight: 800; padding: 5px 10px; font-size: .9rem; border-bottom: 2px dashed #7a4b00; }
  body.calc header .zoo-hero { border-color: #7ff0c6; background: radial-gradient(circle at 83% 18%, rgba(255,196,69,.42), transparent 32%), radial-gradient(circle at 22% 120%, rgba(60,230,170,.42), transparent 45%), linear-gradient(125deg,#053b36 0%,#0a6a5c 57%,#06353a 100%); box-shadow: 0 7px 0 #04302b, 0 15px 30px rgba(5,60,50,.22); }
  body.calc header .zoo-hero .brand .sub { color: #c6fff0; }
  body.calc header .zoo-hero::before { opacity: .22; }
  body.calc header .zoo-llama { background: linear-gradient(145deg,#c6fff0,#7fd9c3); }
  body.calc header .zoo-owl { background: linear-gradient(145deg,#fff0a8,#ffb96a); }
  body.calc header .zoo-pad { background: #04302b; border-color: #7ff0c6; color: #c6fff0; }
  body.calc header .zoo-pad span { color: #ffd54a; }
  body.mode-student.calc .zoo-top-stat { background: rgba(4,48,43,.9); border-color: #8ff0cf; }
  body.mode-student.calc .zoo-top-stat small { color: #c6fff0; }
  body.calc .avatar-trigger { border-color: #7ddfc0; background: linear-gradient(145deg,#fff0a8,#b9f2dd); box-shadow: 0 4px 0 #3c9a82; cursor: default; }
  body.calc .avatar-trigger:hover { transform: none; }
  body.calc .panel-nav[aria-current="page"] { background: var(--calc-d); border-color: var(--calc-d); color: #fff; }
  body.calc .home-next:not(.listen-go) { background: linear-gradient(135deg, #0fa38d, #0b7f7d); border-color: #0b7f7d; box-shadow: 0 6px 18px rgba(11,127,125,.35); }
  body.calc .home-alt.listen-alt { border-color: #d9822b; color: #a85a0f; background: rgba(217,130,43,.1); }
  body.calc .primary { background: var(--calc-d); color: #fff; }
  /* panneau de droite : trois activités + salle de jeux (identique à la lecture) */
  .panel-nav.nombres-cta { background: linear-gradient(145deg,#d6f3ee,#aee8dc); border-color: #0b7f7d; color: #064b49; }
  .panel-nav.nombres-cta .pn-sub { color: #064b49; }
  .panel-nav.add-cta { background: linear-gradient(145deg,#fff1cf,#ffdc8f); border-color: #d9a21f; color: #6b4300; }
  .panel-nav.add-cta .pn-sub { color: #6b4300; }
  .panel-nav.sub-cta { background: linear-gradient(145deg,#ffe3ea,#ffc2d1); border-color: #d6486b; color: #7a1631; }
  .panel-nav.sub-cta .pn-sub { color: #7a1631; }
  .panel-nav.nombres-cta[aria-current="page"] { background: #064b49; border-color: #064b49; color: #fff; } .panel-nav.nombres-cta[aria-current="page"] .pn-sub { color: #fff; }
  .panel-nav.add-cta[aria-current="page"] { background: #6b4300; border-color: #6b4300; color: #fff; } .panel-nav.add-cta[aria-current="page"] .pn-sub { color: #fff; }
  .panel-nav.sub-cta[aria-current="page"] { background: #7a1631; border-color: #7a1631; color: #fff; } .panel-nav.sub-cta[aria-current="page"] .pn-sub { color: #fff; }
  body.mode-student .bottom-nav [data-go="boutique"], body.mode-student .bottom-nav [data-go="cartes"], body.mode-student .bottom-nav [data-go="reconnues"], body.mode-student .bottom-nav [data-go="progres"] { display: none; }
  #panel-right .panel-nav.big.nombres-cta, #panel-right .panel-nav.big.add-cta, #panel-right .panel-nav.big.sub-cta { font-size: 1.12rem; padding: 20px 14px; }
  @media (max-width: 880px) { body.calc #panel-left { display: none; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(30px); opacity: 0; pointer-events: none; z-index: 70; background: #1b2433; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  body.mode-student .toast { bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width: 600px) { .tb-long { display: none; } }
  body.calc-gate main { max-width: 520px; padding-top: 60px; }

  /* ===== Exercices ===== */
  .calc-card h2 { font-family: Fredoka, Figtree, sans-serif; }
  .lvls { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin: 12px 0; }
  .lv { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); text-align: left; font-weight: 700; cursor: pointer; }
  .lv.sug { border-color: var(--calc); border-width: 3px; }
  .lv .ico { font-size: 1.6rem; }
  .lv .st { display: block; font-size: .8rem; font-weight: 800; color: var(--muted); }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 8px 0 14px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); border: 2px solid var(--calc); }
  .dot.cur { background: var(--calc); } .dot.good { background: #17794f; border-color: #17794f; } .dot.miss { background: var(--card); border-color: #b3261e; border-style: dashed; }
  .stage { text-align: center; padding: 6px 0; }
  .say { width: min(230px,70%); min-height: 90px; font-size: 1.6rem; border-radius: 24px; border: 4px solid var(--calc-d); background: var(--calc); color: #fff; font-weight: 800; margin: 6px auto 12px; display: block; cursor: pointer; font-family: Fredoka, Figtree, sans-serif; }
  .eq { font-family: Fredoka, Figtree, sans-serif; font-size: clamp(2.4rem,9vw,3.8rem); font-weight: 700; margin: 6px 0; letter-spacing: .04em; }
  .pic { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; align-items: center; margin: 6px auto 10px; font-size: 2rem; line-height: 1.15; max-width: 560px; }
  .pic .grp { display: inline-flex; flex-wrap: wrap; gap: 2px; max-width: 260px; justify-content: center; padding: 6px 10px; border: 2px dashed var(--line); border-radius: 14px; }
  .pic .gone { opacity: .28; filter: grayscale(1); text-decoration: line-through; }
  .pic .sign { font-size: 2.2rem; font-weight: 800; color: var(--calc); }
  .choices { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; max-width: 520px; margin: 10px auto; }
  .choice { min-height: 84px; font-family: Fredoka, Figtree, sans-serif; font-size: 2.4rem; font-weight: 700; border-radius: 20px; border: 4px solid var(--calc); background: var(--card); color: var(--ink); cursor: pointer; }
  .choice:hover:not([disabled]) { background: var(--calc-l); }
  .choice.good { background: #d9f1e5; border-color: #17794f; color: #17794f; }
  .choice.bad { background: #fbd9d5; border-color: #b3261e; color: #b3261e; animation: cshake .35s; }
  .choice[disabled] { cursor: default; }
  @keyframes cshake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .msg { min-height: 2.4em; font-weight: 800; font-size: 1.15rem; }
  .msg.good { color: #17794f; } .msg.bad { color: #b3261e; }
  .nline { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin: 6px auto 10px; max-width: 640px; }
  .nline b { min-width: 34px; padding: 6px 0; border-radius: 8px; background: var(--card); border: 2px solid var(--line); font-size: 1rem; }
  .crow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .stars { font-size: 3rem; letter-spacing: 6px; }
  /* collections */
  .ngrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .zoo-card .cap b { color: var(--ink); }
  .zoo-card.locked { opacity: .55; }
  .zoo-card .speed { font-size: .8rem; color: var(--muted); font-weight: 700; }
  .reveal { margin: 10px auto; padding: 14px; max-width: 420px; border-radius: 18px; border: 3px solid #f4af24; background: #fff7d6; color: #5c3b00; }
  .reveal .big-pet { font-size: 5rem; line-height: 1.1; }
  .ntile { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font: 700 1.3rem Fredoka, sans-serif; color: var(--ink); }
  .ntile small { font: 700 .7rem Figtree, sans-serif; color: var(--muted); }
  .ntile.off { opacity: .35; background: transparent; border-style: dashed; }
  .ntile.on { border-color: #17794f; background: #e6f6ec; }
  .egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .etile { padding: 10px 8px; border-radius: 14px; border: 2px solid #17794f; background: #e6f6ec; text-align: center; font: 700 1.1rem Fredoka, sans-serif; color: #12302f; }
  .etile small { display: block; font: 700 .75rem Figtree, sans-serif; color: #506d6b; }
  .prog-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .prog-row .nm { flex: 1 1 200px; font-weight: 700; } .prog-row .sc { color: var(--muted); font-size: .9rem; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--line); font-weight: 800; font-size: .8rem; white-space: nowrap; }
  .pill.done { border-color: #17794f; color: #17794f; } .pill.mastered { border-color: var(--calc); color: var(--calc); }
  @media (max-width: 600px) { .choices { gap: 10px; } .choice { min-height: 78px; font-size: 2.1rem; } }
  @media (prefers-reduced-motion: reduce) { .choice.bad { animation: none; } }
</style>

<script>
(function () {
  "use strict";
  var CFG = window.LABO_CALCUL || { enabled: false }, E = window.CalcEngine, V = window.CalcVoice;
  var token = null, client = null, R = null, view = "home", toastTimer = null;
  var S = { name: "", avatar: "🧑", levels: {}, nums: {}, calcs: {}, coins: 0, credits: 0, settings: {} };
  var ACT = {
    nombres: { icon: "👂", title: "J’écoute un nombre", sub: "Je trouve comment il s’écrit", say: "J’écoute un nombre et je trouve comment il s’écrit." },
    addition: { icon: "➕", title: "Addition", sub: "Je calcule des additions", say: "Je calcule des additions." },
    soustraction: { icon: "➖", title: "Soustraction", sub: "Je calcule des soustractions", say: "Je calcule des soustractions." }
  };
  var ADVANCE_MS = 1100;   /* durée d'affichage du « Bravo ! » avant la question suivante */
  var ANIMALS = ["🐥", "🦁", "🐸", "🐘", "🦒", "🐼", "🐢", "🦊"];
  var BRAVO = ["Bravo !", "Super !", "Oui, c’est ça !", "Bien joué !", "Génial !"];
  var QUOTES = ["Compter, c’est faire danser les nombres.", "Un petit pas chaque jour, et les nombres deviennent tes amis.", "Se tromper, c’est apprendre : on réessaie !"];

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function nb(n, one, many) { return n + " " + (n > 1 ? many : one); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
  }
  function rpc(name, args) { return client.rpc(name, args).then(function (r) { if (r.error) throw r.error; return r.data; }); }
  function median(a) { if (!a.length) return 0; var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.floor(s.length / 2)]; }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2800); }
  function say(text) { V.speak(text); }

  /* Message neutre : ne révèle jamais si le labo existe ou si le compte n'y a pas droit */
  function gate(text, link) {
    document.body.classList.add("calc-gate");
    ["panel-left", "panel-right", "bottom-nav", "zoo-top-stats"].forEach(function (id) { $(id).hidden = true; });
    var v = $("view"); clear(v); var g = el("div", "card"); g.appendChild(el("h2", "", text));
    if (link) { var a = el("a", "primary big-btn", link.label); a.href = link.href; a.style.display = "inline-block"; a.style.textDecoration = "none"; a.style.textAlign = "center"; g.appendChild(a); }
    v.appendChild(g);
  }

  function boot() {
    if (!CFG.enabled) { gate("Cette page n’est pas disponible."); return; }
    try { token = sessionStorage.getItem("zoo_student_token"); } catch (e) {}
    if (!token || token === "demo") { gate("Connecte-toi d’abord pour retrouver ton zoo.", { href: "eleve.html", label: "Me connecter" }); return; }
    client = window.supabase.createClient(CFG.url, CFG.key);
    rpc("lab_my_access", { p_token: token }).then(function (a) {
      if (!a || !a.allowed) { gate("Cette page n’est pas disponible."); return; }
      /* lecture seule du profil et de l'avatar du Zoo de Lecture (rien n'est écrit côté lecture) */
      return Promise.all([rpc("lab_student_state", { p_token: token }), rpc("student_session_profile", { p_token: token }).catch(function () { return null; }),
                          rpc("student_get_progress_v2", { p_token: token }).catch(function () { return null; })]).then(function (r) {
        load(r[0]); S.name = (r[1] && r[1].nickname) || "toi";
        var p = r[2] && r[2].progress; if (p && typeof p.avatar === "string" && p.avatar) S.avatar = p.avatar;
        if (p) { S.coins = Math.max(0, Math.floor(Number(p.coins) || 0)); S.credits = Math.max(0, Math.floor(Number(p.credits) || 0)); }

    var keys = Object.keys(S.calcs), card = el("div", "card calc-card"), hatched = 0, total = 0;
    ["addition", "soustraction"].forEach(function (act) { enabledLevels(act).forEach(function (id) { total++; if ((S.levels[act + ":" + id] || {}).ok) hatched++; }); });
    card.appendChild(el("h2", "", "Mes calculs gagnés"));
    card.appendChild(el("p", "muted", nb(hatched, "animal a éclos", "animaux ont éclos") + " sur " + total + " · " + (keys.length ? nb(keys.length, "calcul gagné", "calculs gagnés") + " du premier coup." : "pas encore de calcul gagné : va dans ADDITION ou SOUSTRACTION !")));
    box.appendChild(card);
    ["addition", "soustraction"].forEach(function (act) {
      var c = el("div", "card calc-card"); c.appendChild(el("h2", "", ACT[act].icon + " " + ACT[act].title)); petCards(c, act);
      var op = act === "addition" ? "+" : "-", list = keys.filter(function (k) { return k.indexOf(op) > 0; }).sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
      if (list.length) {
        c.appendChild(el("p", "muted", "Mes calculs gagnés :")); var g = el("div", "egrid");
        list.forEach(function (k) { var p = k.split(op), a = +p[0], b = +p[1], t = el("div", "etile", a + (op === "+" ? " + " : " − ") + b + " = " + (op === "+" ? a + b : a - b)); if (S.calcs[k] > 1) t.appendChild(el("small", "", "gagné " + S.calcs[k] + " fois")); g.appendChild(t); });
        c.appendChild(g);
      }
      box.appendChild(c);
    });
  }
  function progressView(box) {
    var card = el("div", "card calc-card");
    card.appendChild(el("h2", "", "Ma progression"));
    card.appendChild(el("p", "muted", "✓ " + nb(levelsDone(), "niveau réussi", "niveaux réussis") + " · ⭐ " + nb(levelsMastered(), "niveau maîtrisé", "niveaux maîtrisés") + " · 👂 " + numsCount() + " nombres sur 101 · 🧮 " + nb(calcsCount(), "calcul gagné", "calculs gagnés")));
    ["nombres", "addition", "soustraction"].forEach(function (act) {
      card.appendChild(el("h2", "", ACT[act].icon + " " + ACT[act].title));
      E.visibleLevels(act, enabledLevels(act), S.levels).forEach(function (id) {
        var lv = E.levelInfo(act, id), e = S.levels[act + ":" + id], row = el("div", "prog-row");
        row.appendChild(el("span", "nm", (e && e.ok ? lv.animal.e : "🥚") + " " + lv.label));
        if (e && e.q) row.appendChild(el("span", "sc", nb(e.r, "série", "séries") + " · " + Math.round(e.c * 100 / e.q) + " % du premier coup"));
        var st = E.status(e); row.appendChild(el("span", "pill " + st, statusText(act, id))); card.appendChild(row);
      });
    });
    box.appendChild(card);
  }

  /* ===== Navigation ===== */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-go]") : null; if (b && token) { ev.preventDefault(); goTo(b.getAttribute("data-go")); return; }
    var me = $("me-menu"); if (!me.hidden && !(ev.target.closest && ev.target.closest("#bn-me"))) me.hidden = true;
  });
  $("bn-me").addEventListener("click", function (ev) { ev.stopPropagation(); var m = $("me-menu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden)); });
  function logout() { try { sessionStorage.removeItem("zoo_student_token"); sessionStorage.removeItem("zoo_student_name"); } catch (e) {} location.href = "eleve.html"; }
  $("btn-logout").addEventListener("click", logout); $("me-logout").addEventListener("click", logout);
  function lecture() { location.href = "zoo-connecte.html"; }
  $("me-lecture").addEventListener("click", lecture); $("btn-lecture").addEventListener("click", lecture);

  boot();
})();
</script>
