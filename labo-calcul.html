  /* Bandeau : l'animal de la première étape, celui de l'étape du milieu et celui de la dernière (ils flottent doucement, comme dans le Zoo de Lecture) */
  (function mascots() {

  function boot() {

    if (!token || token === "demo") { gate("Connecte-toi d’abord pour retrouver ton zoo.", { href: "eleve.html", label: "Me connecter" }); return; }
    client = window.supabase.createClient(CFG.url, CFG.key);
    rpc("lab_my_access", { p_token: token }).then(function (a) {
      if (!a || !a.allowed) { gate("Cette page n’est pas disponible."); return; }
      /* lecture seule du profil et de l'avatar du Zoo de Lecture (rien n'est écrit côté lecture) */
      return Promise.all([rpc("lab_student_state", { p_token: token }), rpc("student_session_profile", { p_token: token }).catch(function () { return null; }),
                          rpc("student_get_progress_v2", { p_token: token }).catch(function () { return null; }),
                          rpc("student_get_teacher_settings", { p_token: token }).catch(function () { return null; })]).then(function (r) {
        if (window.ZooFx) ZooFx.setSfx(!(r[3] && r[3].sfx === false));
        load(r[0]); S.name = (r[1] && r[1].nickname) || "toi";
        var p = r[2] && r[2].progress; if (p && typeof p.avatar === "string" && p.avatar) S.avatar = p.avatar;
        if (p) { S.coins = Math.max(0, Math.floor(Number(p.coins) || 0)); S.credits = Math.max(0, Math.floor(Number(p.credits) || 0)); }

    }).catch(function () { gate("Un petit souci de connexion. Réessaie dans un instant.", { href: "labo-calcul.html", label: "Réessayer" }); });
  }
  function load(st) {

    S.levels = p.levels || {}; S.nums = p.nums || {}; S.calcs = p.calcs || {};
    S.settings = st.settings || {};
  }
  function enabledLevels(act) {
    var l = S.settings.levels && S.settings.levels[act];
    return (l && l.length ? l : E.DEFAULT_LEVELS[act]).filter(function (id) { return E.levelInfo(act, id); });
  }

  /* ===== Chiffres : niveau = niveaux réussis, nombres = nombres reconnus ===== */
  /* Périmètre = les étapes proposées par l'enseignant. Les réussites hors périmètre (étape désactivée depuis) restent acquises : on les signale à part, on ne les efface jamais. */
  function inScope(k) { var a = k.split(":"); return enabledLevels(a[0]).indexOf(a[1]) >= 0; }

  var LV_CHIPS = [["nombres", "E", "Écouter"], ["addition", "A", "Plus"], ["soustraction", "S", "Moins"]];   /* pastilles d'en-tête : étapes réussies par activité */
  function renderPanels() {

    $("top-coins").textContent = S.coins; $("top-games").textContent = S.credits; LV_CHIPS.forEach(function (c) {
      var n = enabledLevels(c[0]).filter(function (id) { return ((S.levels[c[0] + ":" + id] || {}).ok || 0) >= 1; }).length, box = $("top-lv-" + c[0]);
      box.querySelector("strong").textContent = c[1] + n; box.setAttribute("aria-label", c[2] + " : " + nb(n, "étape réussie", "étapes réussies")); box.title = c[2] + " : " + nb(n, "étape réussie", "étapes réussies");
    });
    $("pl-name").textContent = S.name; $("pl-avatar").textContent = S.avatar;
    $("pr-prog").textContent = levelsDone() ? "✓ " + nb(levelsDone(), "niveau réussi", "niveaux réussis") + (levelsMastered() ? " · ⭐ " + levelsMastered() : "") : "";
    $("pr-games").textContent = nb(S.credits, "partie", "parties");
    ["nombres", "addition", "soustraction"].forEach(function (a) { $("pr-" + a).textContent = levelLabel(a); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { if (b.getAttribute("data-go") === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  }
  function start() {
    document.body.classList.remove("calc-gate");
    ["panel-left", "panel-right", "bottom-nav", "zoo-top-stats"].forEach(function (id) { $(id).hidden = false; });
    goTo("home");
  }
  function goTo(v) {
    V.stop(); R = null; view = v; document.body.classList.remove("listen-focus", "zoo-playing", "zoo-view");
    var me = $("me-menu"); me.hidden = true; $("bn-me").setAttribute("aria-expanded", "false");

       boutique: function (b) { zooFrame(b, "boutique"); }, jeux: function (b) { zooFrame(b, "jeux"); }, cartes: numsView, reconnues: calcsView, progres: progressView })[v](box);
    renderPanels(); window.scrollTo(0, 0);

  /* ===== Boutique et salle d'arcade : espaces PARTAGÉS =====
     Le panneau central est le vrai écran du Zoo de Lecture (mêmes contenus, mêmes effets, mêmes pièces), affiché dans un cadre ;
     le bandeau, les panneaux et la barre du bas restent ceux du Zoo de Calcul. Pendant une partie, le cadre passe en plein écran. */
  function zooFrame(box, v) {
    var f = el("iframe"); f.id = "zoo-frame"; f.title = v === "boutique" ? "Boutique" : "Salle d’arcade";
    f.setAttribute("allow", "fullscreen"); f.setAttribute("allowfullscreen", ""); f.src = "zoo-connecte.html?vue=" + v + "&integre=1";
    document.body.classList.add("zoo-view"); box.appendChild(f); fitFrame();
  }
  /* Le cadre occupe la hauteur visible (sous le bandeau, au-dessus de la barre du bas) : les fenêtres du Zoo (achat, résultats, cadeau) restent ainsi à l'écran */
  function fitFrame() {
    var f = $("zoo-frame"); if (!f || document.body.classList.contains("zoo-playing")) return;

  /* ===== Une série (l'écran entier est consacré à l'exercice, comme l'écoute de la lecture) ===== */

  /* ===== Scène d'évolution : mêmes étapes, mêmes effets (rayons, éclair, feu d'artifice, sons) que dans le Zoo de Lecture ===== */
  function showEvolution(o) {
    var old = document.querySelector(".evo"); if (old) old.parentNode.removeChild(old);
    var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), an = o.lv.animal, hatch = o.from.got === 0, full = o.to.got >= o.to.total;
    var ov = el("div", "evo"); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Ton animal évolue");
    var card = el("div", "evo-card"), stage = el("button", "evo-stage"); stage.type = "button"; stage.setAttribute("aria-label", "Voir l’évolution");
    var rays = el("span", "evo-rays"), flash = el("span", "evo-flash"), face = el("span", "evo-face"); rays.setAttribute("aria-hidden", "true"); flash.setAttribute("aria-hidden", "true");
    stage.appendChild(rays); stage.appendChild(flash); stage.appendChild(face);
    var title = el("h2", "evo-title", "Regarde bien…"), stars = el("div", "evo-stars"), msg = el("p", "evo-msg", hatch ? "Ton œuf bouge !" : cap1(an.nom) + " se prépare…"), acts = el("div", "gr-actions evo-acts");
    stars.setAttribute("aria-hidden", "true"); acts.hidden = true;
    [stage, title, stars, msg, acts].forEach(function (n) { card.appendChild(n); }); ov.appendChild(card); document.body.appendChild(ov);
    function setFace(st) { face.textContent = st.got === 0 ? "🥚" : an.e; face.style.fontSize = (st.got === 0 ? 5.5 : 4.5 + 4 * st.got / st.total) + "rem"; }
    function setStars(st, fresh) { clear(stars); for (var i = 0; i < st.total; i++) stars.appendChild(el("span", "evo-star" + (i < st.got ? " on" : "") + (fresh && i === st.got - 1 ? " new" : ""), "★")); }
    setFace(o.from); setStars(o.from, false);
    var done = false, timers = [], fx = window.ZooFx;
    function finale() {
      if (done) return; done = true; timers.forEach(clearTimeout); face.classList.remove("wobble", "charge"); setFace(o.to); setStars(o.to, true);
      if (!reduce) { flash.classList.add("on"); face.classList.add("pop"); rays.classList.add("on"); if (fx) fx.confetti(110, false); } else rays.classList.add("on");
      var t, m;
      if (full) { t = cap1(an.nom) + " a fini de grandir ! ✨"; m = "Étape maîtrisée ! " + cap1(an.nom) + " " + speedText(o.lv) + "."; }
      else { t = "L’œuf éclot !"; m = "Voici " + an.nom + " ! " + cap1(an.nom) + " " + speedText(o.lv) + "."; }
      title.textContent = t; msg.textContent = m;
      if (fx) [392, 523, 659, 784, 1047].forEach(function (f, k) { fx.tone(f, k * 0.09, 0.3, "triangle", 0.16); });
      V.speak(t + " " + m.replace(/✨/g, ""));
      var go = el("button", "primary big-btn", "Continuer"), zoo = el("button", "secondary big-btn", "🐾 Voir mes animaux"); go.type = "button"; zoo.type = "button";
      function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); var c = $("confetti"); if (c) c.innerHTML = ""; V.stop(); }
      go.addEventListener("click", function () { close(); if (o.onClose) o.onClose(); }); zoo.addEventListener("click", function () { close(); goTo(o.act === "nombres" ? "cartes" : "reconnues"); });
      acts.appendChild(go); acts.appendChild(zoo); acts.hidden = false; go.focus({ preventScroll: true });
    }
    stage.addEventListener("click", finale);
    if (reduce) { finale(); return; }
    face.classList.add(hatch ? "wobble" : "charge");
    if (fx) [262, 294, 330].forEach(function (f, k) { fx.tone(f, k * 0.35, 0.18, "sine", 0.1); });
    timers.push(setTimeout(finale, 1700));
  }

  /* ===== Collections et progression ===== */
  /* Cartes-animaux : œuf tant que l'étape n'est pas réussie, l'animal quand elle l'est, plus grand (✨) quand elle est maîtrisée ; ❓ si l'étape n'est pas encore atteinte */
  function pet(act, id, locked) {
    var lv = E.levelInfo(act, id), e = S.levels[act + ":" + id] || {}, w = el("div", "pet" + (locked ? " locked" : "")), face = el("span", "pet-face"), label;
    if (locked) { face.textContent = "❓"; label = "Animal verrouillé"; }
    else if (!e.ok) { face.textContent = "🥚"; label = "Œuf"; }
    else { face.textContent = lv.animal.e; face.style.fontSize = (e.ok >= 2 ? 4.6 : 3.2) + "rem"; label = lv.animal.nom; }
    face.setAttribute("role", "img"); face.setAttribute("aria-label", label); w.appendChild(face);
    if (!locked && e.ok >= 2) { var sp = el("span", "pet-sparkle", "✨"); sp.setAttribute("aria-hidden", "true"); w.appendChild(sp); }
    return w;
  }
  /* Étoiles = niveau de l'étape, sur 2 : 1 = réussie, 2 = maîtrisée (deux séries réussies) ; les manquantes sont grises. Même règle dans l'éclosion, le bilan et les cartes. */
  function starsOf(ok, cls) { var n = Math.min(2, ok || 0), w = el("div", cls); w.setAttribute("aria-label", n + (n > 1 ? " étoiles" : " étoile") + " sur 2"); w.setAttribute("role", "img"); for (var i = 0; i < 2; i++) w.appendChild(el("span", i < n ? "on" : "off", "★")); return w; }
  function cap1(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  /* Pour un enfant de CP : une comparaison, pas des km/h (les km/h restent dans l'espace enseignant) */
  var VELO = "aussi vite qu’un vélo", VILLE = "aussi vite qu’une voiture en ville", ROUTE = "presque aussi vite qu’une voiture sur la route";
  var SPEED = { "🐌": "tout doucement, comme un escargot", "🐢": "plus vite qu’un escargot, mais moins vite que toi qui marches", "🦔": "à peu près comme toi quand tu cours doucement", "🐓": "presque " + VELO, "🐖": VELO, "🐕": "plus vite qu’un vélo",
    "🐘": "presque " + VILLE, "🐇": VILLE, "🦒": "plus vite qu’une voiture en ville", "🐎": ROUTE, "🐆": "aussi vite qu’une voiture sur l’autoroute",
    "🐜": "plus vite qu’un escargot", "🐿️": VELO, "🦛": "plus vite qu’un vélo", "🐈": "presque " + VILLE, "🦊": VILLE, "🦓": "plus vite qu’une voiture en ville", "🦘": "bien plus vite qu’une voiture en ville", "🦁": ROUTE,
    "🐊": VELO, "🦏": VILLE, "🐺": "plus vite qu’une voiture en ville", "🐪": "plus vite qu’une voiture en ville", "🦌": "bien plus vite qu’une voiture en ville" };
  function speedText(lv) { return "court " + (SPEED[lv.animal.e] || "très vite"); }
  function petCards(card, act) {
    var visible = E.visibleLevels(act, enabledLevels(act), S.levels), grid = el("div", "zoo-grid");
    enabledLevels(act).forEach(function (id) {
      var lv = E.levelInfo(act, id), e = S.levels[act + ":" + id], locked = visible.indexOf(id) < 0 && !(e && e.ok), b = el("div", "zoo-card" + (locked ? " locked" : ""));
      b.appendChild(pet(act, id, locked));
      b.appendChild(el("div", "son", lv.label));
      b.appendChild(el("div", "cap", locked ? "Pas encore" : e && e.ok ? cap1(lv.animal.nom) : "Un œuf à faire éclore"));
      if (!locked && e && e.ok) b.appendChild(el("div", "speed", speedText(lv)));
      b.appendChild(starsOf(e && e.ok, "mini-stars"));
      grid.appendChild(b);
    });
    card.appendChild(grid);
  }
  function numsView(box) {
    var card = el("div", "card calc-card"), act = "nombres", ids = enabledLevels(act), hatched = ids.filter(function (id) { return (S.levels[act + ":" + id] || {}).ok; }).length;
    card.appendChild(el("h2", "", "Mes nombres reconnus"));
    card.appendChild(el("p", "muted", nb(hatched, "animal a éclos", "animaux ont éclos") + " sur " + ids.length + ". Chaque étape réussie fait éclore un animal : plus tu avances dans les nombres, plus l’animal court vite !"));
    petCards(card, act); box.appendChild(card);
    var c2 = el("div", "card calc-card"), found = numsCount();
    c2.appendChild(el("h2", "", "Mes nombres trouvés"));
    c2.appendChild(el("p", "muted", found + (found > 1 ? " nombres reconnus" : " nombre reconnu") + " sur 101. Chaque nombre trouvé du premier coup s’allume !"));
    var g = el("div", "ngrid"); for (var n = 0; n <= 100; n++) { var on = S.nums[n], t = el("div", "ntile" + (on ? " on" : " off"), String(n)); if (on > 1) t.appendChild(el("small", "", "×" + on)); g.appendChild(t); }
    c2.appendChild(g); box.appendChild(c2);
  }
  function calcsView(box) {
    var keys = Object.keys(S.calcs), card = el("div", "card calc-card"), hatched = 0, total = 0;
    ["addition", "soustraction"].forEach(function (act) { enabledLevels(act).forEach(function (id) { total++; if ((S.levels[act + ":" + id] || {}).ok) hatched++; }); });
    card.appendChild(el("h2", "", "Mes calculs gagnés"));
    card.appendChild(el("p", "muted", nb(hatched, "animal a éclos", "animaux ont éclos") + " sur " + total + " · " + (keys.length ? nb(keys.length, "calcul gagné", "calculs gagnés") + " du premier coup." : "pas encore de calcul gagné : va dans ADDITION ou SOUSTRACTION !")));
    box.appendChild(card);
    ["addition", "soustraction"].forEach(function (act) {
      var c = el("div", "card calc-card"); c.appendChild(el("h2", "", ACT[act].icon + " " + ACT[act].title)); petCards(c, act);
      var op = act === "addition" ? "+" : "-", list = keys.filter(function (k) { return k.indexOf(op) > 0; }).sort(function (a, b) { return parseInt(a, 10) - parseInt(b, 10); });
      if (list.length) {
        c.appendChild(el("p", "muted", "Mes calculs gagnés :")); var g = el("div", "egrid");
        list.forEach(function (k) { var p = k.split(op), a = +p[0], b = +p[1], t = el("div", "etile", a + (op === "+" ? " + " : " − ") + b + " = " + (op === "+" ? a + b : a - b)); if (S.calcs[k] > 1) t.appendChild(el("small", "", "gagné " + S.calcs[k] + " fois")); g.appendChild(t); });
        c.appendChild(g);
      }
      box.appendChild(c);
    });
  }
  function progressView(box) {
    var card = el("div", "card calc-card");
    card.appendChild(el("h2", "", "Ma progression"));
    var hid = levelsHidden();
    card.appendChild(el("p", "muted", "✓ " + nb(levelsDone(), "niveau réussi", "niveaux réussis") + (hid ? " (" + (levelsDone() + hid) + " au total, dont " + nb(hid, "masqué", "masqués") + " par ton enseignant)" : "") + " · ⭐ " + nb(levelsMastered(), "niveau maîtrisé", "niveaux maîtrisés") + " · 👂 " + numsCount() + " nombres sur 101 · 🧮 " + nb(calcsCount(), "calcul gagné", "calculs gagnés")));
    card.appendChild(el("p", "muted", "✓ Réussi : une série avec au moins " + Math.min(Math.max(parseInt(S.settings.pass, 10) || 80, 50), 100) + " % de bonnes réponses du premier coup. ⭐ Maîtrisé : deux séries réussies. Une aide ou une erreur ne compte pas comme « du premier coup »."));
    ["nombres", "addition", "soustraction"].forEach(function (act) {
      card.appendChild(el("h2", "", ACT[act].icon + " " + ACT[act].title));
      E.visibleLevels(act, enabledLevels(act), S.levels).forEach(function (id) {
        var lv = E.levelInfo(act, id), e = S.levels[act + ":" + id], row = el("div", "prog-row");
        row.appendChild(el("span", "nm", (e && e.ok ? lv.animal.e : "🥚") + " " + lv.label));
        if (e && e.q) row.appendChild(el("span", "sc", nb(e.r, "série", "séries") + " · " + Math.round(e.c * 100 / e.q) + " % du premier coup"));
        var st = E.status(e); row.appendChild(el("span", "pill " + st, statusText(act, id)));
        if (st === "done") row.appendChild(el("span", "sc", "encore une série réussie pour ⭐"));
        card.appendChild(row);
      });
    });
    box.appendChild(card);
  }

  /* ===== Navigation ===== */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-go]") : null; if (b && token) { ev.preventDefault(); goTo(b.getAttribute("data-go")); return; }
    var me = $("me-menu"); if (!me.hidden && !(ev.target.closest && ev.target.closest("#bn-me"))) me.hidden = true;
  });
  $("btn-moi").addEventListener("click", function (ev) { ev.stopPropagation(); var m = $("me-menu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden)); });
  $("bn-me").addEventListener("click", function (ev) { ev.stopPropagation(); var m = $("me-menu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden)); });
  function logout() { try { sessionStorage.removeItem("zoo_student_token"); sessionStorage.removeItem("zoo_student_name"); } catch (e) {} location.href = "eleve.html"; }
  $("btn-logout").addEventListener("click", logout); $("me-logout").addEventListener("click", logout);
  function lecture() { location.href = "zoo-connecte.html"; }
  $("me-lecture").addEventListener("click", lecture);

  boot();
})();
</script>
