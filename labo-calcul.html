    card.appendChild(el("p", "muted", "✓ " + nb(levelsDone(), "niveau réussi", "niveaux réussis") + (hid ? " (" + (levelsDone() + hid) + " au total, dont " + nb(hid, "masqué", "masqués") + " par ton enseignant)" : "") + " · ⭐ " + nb(levelsMastered(), "niveau maîtrisé", "niveaux maîtrisés") + " · 👂 " + numsCount() + " nombres sur 101 · 🧮 " + nb(calcsCount(), "calcul gagné", "calculs gagnés")));
    card.appendChild(el("p", "muted", "✓ Réussi : une série avec au moins " + Math.min(Math.max(parseInt(S.settings.pass, 10) || 80, 50), 100) + " % de bonnes réponses du premier coup. ⭐ Maîtrisé : deux séries réussies. Une aide ou une erreur ne compte pas comme « du premier coup »."));
    ["nombres", "addition", "soustraction"].forEach(function (act) {
      card.appendChild(el("h2", "", ACT[act].icon + " " + ACT[act].title));
      E.visibleLevels(act, enabledLevels(act), S.levels).forEach(function (id) {
        var lv = E.levelInfo(act, id), e = S.levels[act + ":" + id], row = el("div", "prog-row");
        row.appendChild(el("span", "nm", (e && e.ok ? lv.animal.e : "🥚") + " " + lv.label));
        if (e && e.q) row.appendChild(el("span", "sc", nb(e.r, "série", "séries") + " · " + Math.round(e.c * 100 / e.q) + " % du premier coup"));
        var st = E.status(e); row.appendChild(el("span", "pill " + st, statusText(act, id)));
        if (st === "done") row.appendChild(el("span", "sc", "encore une série réussie pour ⭐"));
        card.appendChild(row);
      });
    });
    box.appendChild(card);
  }

  /* ===== La roue (2e étoile d'une étape) : le lot est tiré par le serveur, la roue ne fait que l'afficher ===== */
  /* Les 8 cases sont celles de la roue du Zoo de Lecture (SLICES / SLICE_COLORS de zoo-connecte.html) et du serveur : t = « plays » (parties de jeu) ou « coins » (pièces d'or) */
  var WHEEL = [{ t: "plays", n: 1, label: "1 jeu", c: "#9fd6b0" }, { t: "coins", n: 5, label: "5 pièces", c: "#f5c542" }, { t: "plays", n: 2, label: "2 jeux", c: "#b98be6" }, { t: "plays", n: 1, label: "1 jeu", c: "#f0904a" },
               { t: "coins", n: 10, label: "10 pièces", c: "#f5c542" }, { t: "plays", n: 3, label: "3 jeux", c: "#8fc1f0" }, { t: "plays", n: 1, label: "1 jeu", c: "#e47fd0" }, { t: "plays", n: 2, label: "2 jeux", c: "#b98be6" }];
  var SAID = ["zéro", "une", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix"];
  function wheelSvg() {
    var n = WHEEL.length, step = 360 / n, out = '<svg viewBox="-100 -100 200 200" aria-hidden="true">';
    WHEEL.forEach(function (sl, i) {
      var a0 = (-90 + i * step) * Math.PI / 180, a1 = (-90 + (i + 1) * step) * Math.PI / 180, am = -90 + i * step + step / 2, flip = am > 90;
      out += '<path d="M0 0 L' + (100 * Math.cos(a0)).toFixed(2) + ' ' + (100 * Math.sin(a0)).toFixed(2) + ' A100 100 0 0 1 ' + (100 * Math.cos(a1)).toFixed(2) + ' ' + (100 * Math.sin(a1)).toFixed(2) + ' Z" style="fill:' + sl.c + '" stroke="#1b2433" stroke-width="1.5"/>';
      out += '<text transform="rotate(' + (flip ? am + 180 : am) + ') translate(' + (flip ? -92 : 92) + ' 0)" text-anchor="' + (flip ? "start" : "end") + '" dominant-baseline="central" style="fill:#1b2433;font-size:11px;font-weight:800;font-family:Figtree,system-ui,sans-serif">' + sl.label + '</text>';
    });
    return out + '<circle r="9" style="fill:#1b2433"/></svg>';
  }
  function wheelScreen(onDone) {
    V.stop(); var box = $("view"); clear(box);
    var card = el("div", "card calc-card stage"), reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    card.appendChild(el("h2", "", "🎡 La roue des récompenses")); var msg = el("p", "msg", "Tu as gagné une roue ! Touche le bouton pour la lancer."); msg.setAttribute("role", "status"); card.appendChild(msg);
    var wrap = el("div", "cwheel-wrap"), wheel = el("div", "cwheel"); wheel.innerHTML = wheelSvg(); wrap.appendChild(el("div", "cwheel-ptr", "▼")); wrap.appendChild(wheel); card.appendChild(wrap);
    var win = el("div", "cwheel-win"); card.appendChild(win);
    var row = el("div", "crow"), spin = el("button", "primary big-btn", "🎡 Lancer la roue"), done = el("button", "primary big-btn", "Continuer"); spin.type = done.type = "button"; done.hidden = true;
    row.appendChild(spin); row.appendChild(done); card.appendChild(row); box.appendChild(card);
    var turns = 0;
    done.addEventListener("click", function () { V.stop(); (onDone || function () { goTo("home"); })(); });
    spin.addEventListener("click", function () {
      spin.disabled = true; msg.className = "msg"; msg.textContent = "La roue tourne…"; win.textContent = ""; done.hidden = true;
      rpc("lab_student_spin_wheel", { p_token: token }).then(function (r) {
        var k = Math.max(0, Math.min(7, Math.floor(Number(r.slice) || 0))); turns++;
        var target = 360 * 5 * turns + (360 - (k * 45 + 22.5)) + (Math.random() * 20 - 10);
        wheel.style.transition = reduce ? "none" : "transform 4.2s cubic-bezier(.17,.67,.2,1)"; wheel.style.transform = "rotate(" + target + "deg)";
        setTimeout(function () {
          var plays = r.kind === "plays", c = Math.floor(Number(plays ? r.plays : r.coins) || 0), big = c >= 10 || (plays && c >= 3);
          var word = plays ? c + (c > 1 ? " parties de jeu" : " partie de jeu") : c + (c > 1 ? " pièces d’or" : " pièce d’or");
          var said = (SAID[c] || c) + (plays ? (c > 1 ? " parties de jeu" : " partie de jeu") : (c > 1 ? " pièces d’or" : " pièce d’or"));
          S.wheels = Math.max(0, Math.floor(Number(r.wheels) || 0));
          msg.className = "msg good"; msg.textContent = (big ? "JACKPOT ! " : "Bravo ! ") + "Tu gagnes " + word + " !"; win.textContent = "";
          if (plays) win.textContent = "+" + c + " 🎮"; else { win.appendChild(document.createTextNode("+" + c + " ")); win.appendChild(el("span", "gold-coin")); }
          if (window.ZooFx) { if (!reduce) ZooFx.confetti(big ? 140 : 70, !plays); [523, 659, 784, 1047].forEach(function (f, i) { ZooFx.tone(f, i * 0.09, 0.25, "triangle", 0.12); }); }
          if (S.settings.voice !== false) V.speak("Et c’est… " + said + " ! Bravo !");
          if (r.shared) claimCoins();
          else { if (plays) S.credits = Math.max(0, Math.floor(Number(r.test_credits) || 0)); renderPanels(); }
          if (S.wheels > 0) { spin.disabled = false; spin.textContent = "🎡 Relancer la roue"; spin.hidden = false; } else spin.hidden = true;
          done.hidden = false; done.focus({ preventScroll: true });
        }, reduce ? 60 : 4400);
      }).catch(function () { spin.disabled = false; msg.className = "msg bad"; msg.textContent = "Un petit souci de connexion. Touche encore le bouton."; });
    });
  }

  /* ===== Navigation ===== */
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-go]") : null; if (b && token) { ev.preventDefault(); goTo(b.getAttribute("data-go")); return; }
    var me = $("me-menu"); if (!me.hidden && !(ev.target.closest && ev.target.closest("#bn-me"))) me.hidden = true;
  });
  $("bn-me").addEventListener("click", function (ev) { ev.stopPropagation(); var m = $("me-menu"); m.hidden = !m.hidden; this.setAttribute("aria-expanded", String(!m.hidden)); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !R) claimGifts(); });
  window.addEventListener("focus", function () { if (!R) claimGifts(); });
  function logout() { try { sessionStorage.removeItem("zoo_student_token"); sessionStorage.removeItem("zoo_student_name"); } catch (e) {} location.href = "eleve.html"; }
  $("btn-logout").addEventListener("click", logout); $("me-logout").addEventListener("click", logout);
  /* Changer son code secret : ancien code, nouveau code deux fois ; le serveur vérifie tout (student_change_pin, comme dans le Zoo de Lecture) */
  function openPinDialog() {
    if (document.querySelector(".pin-dialog")) return;
    var ov = el("div", "pin-dialog"); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Changer mon code secret");
    var card = el("div", "pin-card"), form = el("form", "pin-form"), inputs = {};
    card.appendChild(el("h2", "", "🔑 Changer mon code secret"));
    [["old", "Mon code actuel"], ["n1", "Mon nouveau code (4 à 8 chiffres)"], ["n2", "Mon nouveau code, encore une fois"]].forEach(function (f) {
      var lab = el("label", "pin-label", f[1]), inp = document.createElement("input");
      inp.type = "password"; inp.inputMode = "numeric"; inp.maxLength = 8; inp.autocomplete = "off"; inp.className = "pin-input";
      lab.appendChild(inp); form.appendChild(lab); inputs[f[0]] = inp;
    });
    var msgEl = el("p", "pin-msg"); msgEl.setAttribute("role", "status");
    var acts = el("div", "pin-actions"), ok = el("button", "primary big-btn", "Changer"), cancel = el("button", "secondary big-btn", "Annuler");
    ok.type = "submit"; cancel.type = "button"; acts.appendChild(ok); acts.appendChild(cancel);
    form.appendChild(msgEl); form.appendChild(acts); card.appendChild(form); ov.appendChild(card); document.body.appendChild(ov);
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
    cancel.addEventListener("click", close); ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
    function say(t, bad) { msgEl.textContent = t; msgEl.className = "pin-msg " + (bad ? "bad" : "good"); }
    var re = /^[0-9]{4,8}$/;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var o = inputs.old.value, a = inputs.n1.value, b = inputs.n2.value;
      if (!re.test(o)) { say("Écris ton code actuel (des chiffres).", true); return; }
      if (!re.test(a)) { say("Le nouveau code doit avoir de 4 à 8 chiffres.", true); return; }
      if (a !== b) { say("Les deux nouveaux codes ne sont pas pareils.", true); return; }
      if (a === o) { say("Le nouveau code doit être différent de l’ancien.", true); return; }
      ok.disabled = true; say("Un instant…", false);
      rpc("student_change_pin", { p_token: token, p_old_pin: o, p_new_pin: a }).then(function (r) {
        r = r || {};
        if (r.ok) {
          say("✅ C’est fait ! Retiens bien ton nouveau code.", false);
          Object.keys(inputs).forEach(function (k) { inputs[k].value = ""; inputs[k].disabled = true; });
          ok.hidden = true; cancel.textContent = "Fermer"; cancel.className = "primary big-btn"; cancel.focus(); return;
        }
        say(r.code === "locked" ? "Trop d’essais. Réessaie dans 15 minutes, ou demande à ton maître(sse)." : "Ton code actuel n’est pas bon.", true); ok.disabled = false;
      }).catch(function (err) {
        var m = String((err && err.message) || "");
        say(/Session expir/.test(m) ? "Ta connexion a expiré : reconnecte-toi." : (/désactivé|4 à 8|différent/.test(m) ? m : "Impossible de changer le code pour le moment."), true); ok.disabled = false;
      });
    });
    inputs.old.focus();
  }
  $("btn-pin-left").addEventListener("click", openPinDialog); $("me-pin").addEventListener("click", openPinDialog);
  function lecture() { location.href = "zoo-connecte.html"; }
  $("me-lecture").addEventListener("click", lecture);

  boot();
})();
</script>
