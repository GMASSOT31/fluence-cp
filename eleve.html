<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion élève · Zoo de Lecture</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f6f1ff;color:#30234c;margin:0}main{max-width:490px;margin:6vh auto;padding:18px}.card{background:white;border-radius:22px;padding:28px;box-shadow:0 10px 30px #24154414}h1{text-align:center;font-size:32px}label{display:block;margin:18px 0 6px;font-weight:700}input{width:100%;padding:14px;font-size:20px;border:2px solid #c7b6ef;border-radius:12px}button{width:100%;margin-top:22px;background:#7046ce;border:0;color:white;border-radius:12px;padding:15px;font-size:19px;font-weight:750;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}.muted{color:#6a607e}#error{color:#a32d45}a{color:#7046ce}</style></head><body><main><h1>🦁 Zoo de Lecture</h1><div class="card"><section id="login"><h2>🎒 Je me connecte</h2><p class="muted">Demande à ta maîtresse ton code de classe et ton PIN secret.</p><form id="form"><label for="code">Code de ma classe</label><input id="code" autocomplete="off" maxlength="10" required autocapitalize="characters" placeholder="Ex. A12B34C56D"><label for="nickname">Mon prénom ou pseudo</label><input id="nickname" autocomplete="off" maxlength="60" required><label for="pin">Mon code secret (PIN)</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" required><button id="submit">Entrer dans mon Zoo 🐾</button></form></section><section id="connected" hidden><h2 id="welcome"></h2><p>Ton profil a été retrouvé sur le serveur !</p><p id="status" class="muted"></p><p class="muted">Ton Zoo connecté est prêt. Tes récompenses et tes records sont enregistrés sur le serveur.</p><button id="openZoo" type="button">🎮 Entrer dans mon Zoo connecté</button><button id="logout">Me déconnecter</button></section><p id="error" role="alert"></p><p style="margin-top:28px;border-top:1px solid #e7def5;padding-top:20px"><a href="enseignants.html" style="font-weight:700">👩‍🏫 Je suis la maîtresse : accéder à mon espace enseignant</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(function(){"use strict";const api=window.supabase.createClient("https://pcxpazpflnlwmhyuozdx.supabase.co","sb_publishable_j65mDpDNsuwwaL6uRjsMtA_U_OXQXlL");const $=x=>document.getElementById(x);let token=null;
function bytesHex(bytes){return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")}
async function openSession(t,name){const {data,error}=await api.rpc("student_get_progress",{p_token:t});if(error)throw error;token=t;$("login").hidden=true;$("connected").hidden=false;$("welcome").textContent="Bonjour "+name+" ! 🐼";$("status").textContent="Sauvegarde serveur prête : "+(data&&Object.keys(data).length?"progression existante trouvée":"nouveau profil");}
$("form").onsubmit=async e=>{e.preventDefault();$("error").textContent="";$("submit").disabled=true;try{const t=bytesHex(crypto.getRandomValues(new Uint8Array(32)));const {data,error}=await api.rpc("student_sign_in",{p_code:$("code").value.trim().toUpperCase(),p_nickname:$("nickname").value.trim(),p_pin:$("pin").value,p_token:t});if(error)throw error;sessionStorage.setItem("zoo_student_token",t);sessionStorage.setItem("zoo_student_name",data.nickname);await openSession(t,data.nickname);$("pin").value=""}catch(err){$("error").textContent=err.message||"Connexion impossible."}finally{$("submit").disabled=false}};
$("openZoo").onclick=()=>{location.href="zoo-connecte.html"};
$("logout").onclick=()=>{sessionStorage.removeItem("zoo_student_token");sessionStorage.removeItem("zoo_student_name");token=null;$("connected").hidden=true;$("login").hidden=false};
const existing=sessionStorage.getItem("zoo_student_token");if(existing)openSession(existing,sessionStorage.getItem("zoo_student_name")||"").catch(()=>{sessionStorage.removeItem("zoo_student_token");sessionStorage.removeItem("zoo_student_name")});
})();
</script></body></html>
